name: Attendly website checks
on:
  push:
    paths:
      - '*.html'
      - 'tests/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - '*.html'
      - 'tests/**'
      - '.github/workflows/website.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
